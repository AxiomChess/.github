name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required templates
        run: |
          set -euo pipefail
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          test -f .github/ISSUE_TEMPLATE/feature_request.yml
          test -f actions/lint-placeholder/action.yml
          test -f workflow-templates/lint-placeholder.yml
          test -f workflow-templates/lint-placeholder.properties.json
          test -f docs/CODEOWNERS.md
          test -f CODEOWNERS
          test -f README.md
          test -f profile/README.md
          test -f profile/assets/banner.svg
          test -f profile/assets/mark.svg
          grep -q "https://github.com/AxiomChess" profile/README.md
          grep -q "no emoji" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "Co-authored-by" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "Secrets not staged" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "AxiomChess/.github/actions/lint-placeholder" README.md
          grep -q "profile/README.md" README.md
          echo "template checks OK"
      - name: Run lint-placeholder action
        uses: ./actions/lint-placeholder
